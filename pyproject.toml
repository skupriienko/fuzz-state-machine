[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzz-state-machine"
version = "1.1.0"
description = "Deterministic Invariant Fuzzing & Plan State Machine Engine for AI Agents"
readme = "README.md"
authors = [
    { name = "Serhii Kupriienko", email = "61395455+skupriienko@users.noreply.github.com" }
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
dev = [
    "pyyaml>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/skupriienko/fuzz-state-machine"
Repository = "https://github.com/skupriienko/fuzz-state-machine.git"
Issues = "https://github.com/skupriienko/fuzz-state-machine/issues"

[project.scripts]
fsm-engine = "fuzz_state_machine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fuzz_state_machine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
